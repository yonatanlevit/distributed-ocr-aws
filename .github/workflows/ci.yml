name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Same OS as the system's AMI (README section 12): tess4j needs the newer
    # Tesseract/Leptonica that Ubuntu 26.04 ships.
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Java 21, Maven and Tesseract
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            openjdk-21-jdk-headless maven tesseract-ocr tesseract-ocr-eng libtesseract-dev

      - name: Build and run unit tests
        run: mvn -B package
